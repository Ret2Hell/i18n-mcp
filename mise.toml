[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
hk = "latest"
goreleaser = "2.18.1"
syft = "1.51.1"

[settings]
jobs = 4
lockfile = true

[env]
CGO_ENABLED = "0"
GOCACHE = "{{env.HOME}}/.cache/go-build"

[tasks.install]
description = "Download Go module dependencies"
sources = ["go.mod", "go.sum"]
run = "go mod download"
alias = ["i"]

[tasks.hooks]
description = "Install hk Git hooks"
run = "hk install --mise"
alias = ["hook"]

[tasks.build]
description = "Build the i18n-mcp binary"
depends = ["install"]
sources = ["cmd/**/*.go", "internal/**/*.go", "go.mod", "go.sum", "scripts/build.sh", "version"]
outputs = ["bin/i18n-mcp"]
run = "sh scripts/build.sh"
alias = ["b"]

[tasks.start]
description = "Start the i18n-mcp server"
depends = ["build"]
run = "./bin/i18n-mcp"
alias = ["s"]

[tasks.docker-build]
description = "Build the Docker image"
sources = ["cmd/**/*.go", "internal/**/*.go", "Dockerfile", "go.mod", "go.sum", "version"]
run = "VERSION=$(tr -d '[:space:]' < version); COMMIT=$(git rev-parse --short=12 HEAD); DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ'); docker build --build-arg VERSION=$VERSION --build-arg COMMIT=$COMMIT --build-arg DATE=$DATE -t i18n-mcp:$VERSION -t i18n-mcp:latest ."
alias = ["db"]

[tasks.docker-run]
description = "Run the Docker image"
depends = ["docker-build"]
run = "docker run --rm -i --env-file .env i18n-mcp"
alias = ["dr"]

[tasks.release-snapshot]
description = "Build a local GoReleaser snapshot"
depends = ["check"]
run = "DOCKER_IMAGE=${DOCKER_IMAGE:-ret2hell/i18n-mcp} goreleaser release --snapshot --clean --skip=docker,publish"
alias = ["rs"]

[tasks.fmt]
description = "Format Go files"
run = "gofmt -w ."
alias = ["f"]

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"
alias = ["td"]

[tasks.fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\""
alias = ["fc"]

[tasks.tidy-check]
description = "Check whether Go modules are tidy"
run = "go mod tidy -diff"
alias = ["tc"]

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."
alias = ["v"]

[tasks.test]
description = "Run tests"
run = "go test ./..."
alias = ["t"]

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"
alias = ["l"]

[tasks.check]
description = "Run all validation checks"
depends = ["build", "fmt-check", "tidy-check", "vet", "lint", "test"]
alias = ["c"]

[tasks.clean]
description = "Remove generated artifacts"
run = "rm -rf tmp bin dist"
alias = ["cl"]
