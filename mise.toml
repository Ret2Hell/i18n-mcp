[tools]
go = "1.26.6"
golangci-lint = "2.12.2"
lefthook = "latest"
goreleaser = "2.16"
syft = "1.38.0"

[env]
CGO_ENABLED = "0"
GOCACHE = "{{env.HOME}}/.cache/go-build"

[tasks.build]
run = "sh scripts/build.sh"

[tasks.start]
run = "./bin/i18n-mcp"

[tasks.docker-build]
run = "VERSION=$(tr -d '[:space:]' < version); COMMIT=$(git rev-parse --short=12 HEAD); DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ'); docker build --build-arg VERSION=$VERSION --build-arg COMMIT=$COMMIT --build-arg DATE=$DATE -t i18n-mcp:$VERSION -t i18n-mcp:latest ."
description = "Build Docker image"

[tasks.release-snapshot]
run = "DOCKER_IMAGE=${DOCKER_IMAGE:-ret2hell/i18n-mcp} goreleaser release --snapshot --clean --skip=docker,publish"
description = "Build a local GoReleaser snapshot into dist/"

[tasks.docker-run]
run = "docker run --rm -i --env-file .env i18n-mcp"
description = "Run Docker image"

[tasks.fmt]
run = "gofmt -w ."
description = "Format Go files"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy Go modules"

[tasks.vet]
run = "go vet ./..."
description = "Run go vet"

[tasks.test]
run = "go test ./..."
description = "Run tests"

[tasks.lint]
run = "golangci-lint run"
description = "Run golangci-lint"

[tasks.check]
run = [
  "mise run tidy",
  "mise run fmt",
  "mise run vet",
  "mise run lint",
  "mise run test",
]
description = "Run all local checks"

[tasks.clean]
run = "rm -rf tmp bin"
description = "Remove build artifacts"
