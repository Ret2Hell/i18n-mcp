name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: v1.7.7
  GORELEASER_VERSION: v2.16.0
  GOVULNCHECK_VERSION: v1.1.4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go test
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            go test ./...
          else
            go test -race -covermode=atomic -coverprofile=coverage.out ./...
          fi

      - name: Coverage summary
        if: github.event_name != 'pull_request'
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')"
          {
            echo "## Coverage"
            echo
            echo "Total coverage: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Install Go security tools
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck
        if: github.event_name != 'pull_request'
        run: govulncheck ./...

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: |
          python -m venv .venv-zizmor
          .venv-zizmor/bin/pip install -r .github/tools/requirements.txt
          .venv-zizmor/bin/zizmor .

  goreleaser:
    name: GoReleaser Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - name: Install GoReleaser
        run: |
          go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: GoReleaser check
        env:
          DOCKER_IMAGE: ret2hell/i18n-mcp
        run: goreleaser check .goreleaser.yaml

      - name: GoReleaser smoke build
        env:
          DOCKER_IMAGE: ret2hell/i18n-mcp
          GOOS: linux
          GOARCH: amd64
        run: goreleaser build --snapshot --clean --single-target

  docker-build:
    runs-on: ubuntu-24.04
    name: Docker Build
    timeout-minutes: 20
    needs: [test, lint, security]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Read version
        id: version
        run: scripts/read-version.sh github-output

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: |
            i18n-mcp:${{ steps.version.outputs.version }}
            i18n-mcp:ci-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: i18n-mcp:${{ steps.version.outputs.version }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate Trivy SARIF
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: i18n-mcp:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

  prepare-release-tag:
    name: Check release tag
    needs: [docker-build, goreleaser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      should_create: ${{ steps.prepare.outputs.should_create }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine whether a release tag is needed
        id: prepare
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          release_tag="$(scripts/read-version.sh tag)"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          version_changed=true
          if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin "$BEFORE_SHA" --depth=1 || true
            if git rev-parse --verify "$BEFORE_SHA" >/dev/null 2>&1; then
              if git diff --quiet "$BEFORE_SHA" HEAD -- version; then
                version_changed=false
              fi
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- version; then
              version_changed=false
            fi
          fi

          if [[ "$version_changed" != true ]]; then
            echo "version did not change in the CI head commit; skipping tag creation"
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags origin "+refs/tags/${release_tag}:refs/tags/${release_tag}" || true
          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${release_tag}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$tagged_commit" != "$current_commit" ]]; then
              echo "Tag ${release_tag} already exists on a different commit" >&2
              exit 1
            fi
            echo "Tag ${release_tag} already exists on this commit; nothing to do"
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_create=true" >> "$GITHUB_OUTPUT"

  create-release-tag:
    name: Create release tag
    needs: prepare-release-tag
    if: needs.prepare-release-tag.outputs.should_create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || {
            echo "Missing RELEASE_TOKEN secret." >&2
            echo "A PAT or GitHub App token is required because tags pushed with GITHUB_TOKEN do not trigger workflows." >&2
            exit 1
          }

      - name: Create release tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-tag.outputs.release_tag }}
        run: |
          authenticated_remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags "$authenticated_remote"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$tagged_commit" != "$current_commit" ]]; then
              echo "Tag ${RELEASE_TAG} already exists on a different commit" >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists on this commit; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push "$authenticated_remote" "refs/tags/${RELEASE_TAG}"
