name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GORELEASER_VERSION: v2.16.0
  SYFT_VERSION: v1.38.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - name: Validate release tag
        run: |
          version="$(scripts/read-version.sh)"
          expected_tag="$(scripts/read-version.sh tag)"
          echo "Version file: $version"
          echo "Expected tag: $expected_tag"
          echo "Current ref type: ${GITHUB_REF_TYPE}"
          echo "Current ref name: ${GITHUB_REF_NAME}"

          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version file $version" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Install release tools
        run: |
          go install "github.com/goreleaser/goreleaser/v2@${GORELEASER_VERSION}"
          mkdir -p "${HOME}/.local/bin"
          syft_archive="$(mktemp)"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" -o "$syft_archive"
          tar -xzf "$syft_archive" -C "${HOME}/.local/bin" syft
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret" >&2; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate release notes
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/i18n-mcp
        run: |
          mkdir -p tmp
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > tmp/RELEASE_NOTES.md
          cat tmp/RELEASE_NOTES.md

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/i18n-mcp
        run: goreleaser release --clean --release-notes tmp/RELEASE_NOTES.md

      # Artifact attestations are disabled while this repository is private.
      # GitHub currently does not support persisting attestations for
      # user-owned private repositories.
