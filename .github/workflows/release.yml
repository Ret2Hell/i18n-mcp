name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          cache: false

      - name: Validate release tag
        run: |
          version="$(tr -d '[:space:]' < version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          expected_tag="v$version"
          echo "Version file: $version"
          echo "Expected tag: $expected_tag"
          echo "Current ref type: ${GITHUB_REF_TYPE}"
          echo "Current ref name: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version file $version" >&2
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Install release tools
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.16.0
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "${HOME}/.local/bin" v1.38.0
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME secret" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN secret" >&2; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate release notes
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/i18n-mcp
        run: |
          mkdir -p tmp
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > tmp/RELEASE_NOTES.md
          cat tmp/RELEASE_NOTES.md

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/i18n-mcp
        run: goreleaser release --clean --release-notes tmp/RELEASE_NOTES.md

      # Artifact attestations are disabled while this repository is private.
      # GitHub currently does not support persisting attestations for
      # user-owned private repositories.
